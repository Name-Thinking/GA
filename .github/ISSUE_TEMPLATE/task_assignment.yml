name: Task / Feature Request
description: เสนอหรือมอบหมายฟีเจอร์สำหรับระบบจัดแบ่งทีมกีฬาด้วย GA
title: "[TASK]: "
labels: ["enhancement", "algorithm"]
body:
  - type: markdown
    attributes:
      value: |
        ### แบบฟอร์มเสนอ Task การพัฒนาระบบแบ่งทีมกีฬา (Genetic Algorithm)
  - type: textarea
    id: description
    attributes:
      label: รายละเอียดของงาน (Objective & Description)
      description: อธิบายสิ่งที่ต้องทำ
      placeholder: ออกแบบ Chromosome Representation และ Fitness Function สำหรับ Sports Fairness และ Harmonization
    validations:
      required: true
  - type: checkboxes
    id: criteria
    attributes:
      label: เกณฑ์การยอมรับ (Acceptance Criteria)
      options:
        - label: ใช้อัลกอริทึม Genetic Algorithm (GA) เท่านั้น
        - label: มีการวัดความสมดุลทางกีฬา (Sports Engagement & Fairness)
        - label: มีการกระจายสมาชิกข้ามแผนกอย่างทั่วถึง (Cross-department Harmonization)
        - label: มีการ visualize ผลลัพธ์เป็นกราฟและตารางสรุปผล

